<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Async Tools Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100dvh;
      padding: 16px;
    }

    header {
      width: 100%;
      max-width: 720px;
      margin-bottom: 12px;
    }

    header h1 { font-size: 1.1rem; font-weight: 600; color: #1a1a1a; }
    header p  { font-size: 0.8rem; color: #666; margin-top: 2px; }

    #chat {
      flex: 1;
      width: 100%;
      max-width: 720px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 4px 0 12px;
    }

    .bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.9rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .bubble.assistant p        { margin: 0 0 0.5em; }
    .bubble.assistant p:last-child { margin-bottom: 0; }
    .bubble.assistant ol,
    .bubble.assistant ul       { padding-left: 1.4em; margin: 0 0 0.5em; }
    .bubble.assistant li       { margin-bottom: 0.2em; }

    .bubble.user {
      align-self: flex-end;
      background: #0a7cff;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .bubble.assistant {
      align-self: flex-start;
      background: #fff;
      color: #1a1a1a;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    .bubble.thinking {
      align-self: flex-start;
      background: #fff;
      color: #888;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      font-style: italic;
    }

    #input-row {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 720px;
    }

    #msg {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 20px;
      font-size: 0.9rem;
      outline: none;
      background: #fff;
    }

    #msg:focus { border-color: #0a7cff; }

    button {
      padding: 10px 20px;
      background: #0a7cff;
      color: #fff;
      border: none;
      border-radius: 20px;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
    }

    button:disabled { background: #aaa; cursor: default; }

    #reset-btn {
      background: transparent;
      color: #888;
      border: 1px solid #ddd;
      padding: 10px 14px;
    }

    #reset-btn:hover { background: #f5f5f5; }
  </style>
</head>
<body>
  <header>
    <h1>Async Tools Demo</h1>
    <p>Ask about <strong>hotels</strong>, <strong>activities</strong>, <strong>flights</strong> (Tokyo→Mumbai/Amsterdam), or <strong>weather</strong>. Results appear automatically.</p>
  </header>

  <div id="chat"></div>

  <div id="input-row">
    <input id="msg" type="text" placeholder="e.g. Find flights from Tokyo to Amsterdam" autofocus>
    <button id="send-btn" onclick="sendMessage()">Send</button>
    <button id="reset-btn" onclick="resetChat()" title="Clear conversation">Reset</button>
  </div>

  <script>
    const chat    = document.getElementById("chat");
    const msgInput = document.getElementById("msg");
    const sendBtn  = document.getElementById("send-btn");
    let thinkingEl = null;

    // ── SSE connection ────────────────────────────────────────────────────────

    const es = new EventSource("/stream");

    es.onmessage = (e) => {
      const event = JSON.parse(e.data);

      if (event.type === "assistant") {
        removeThinking();
        addBubble("assistant", event.data.content);
      } else if (event.type === "reset") {
        chat.innerHTML = "";
      }
    };

    es.onerror = () => {
      // EventSource auto-reconnects; nothing to do here
    };

    // ── Helpers ───────────────────────────────────────────────────────────────

    function addBubble(role, text) {
      const el = document.createElement("div");
      el.className = `bubble ${role}`;
      if (role === "assistant") {
        el.innerHTML = marked.parse(text);
      } else {
        el.textContent = text;
      }
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
      return el;
    }

    function showThinking() {
      if (thinkingEl) return;
      thinkingEl = addBubble("thinking", "Thinking…");
    }

    function removeThinking() {
      if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
    }

    // ── Send message ──────────────────────────────────────────────────────────

    async function sendMessage() {
      const text = msgInput.value.trim();
      if (!text) return;

      msgInput.value = "";
      sendBtn.disabled = true;
      addBubble("user", text);
      showThinking();

      try {
        await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });
      } catch (err) {
        removeThinking();
        addBubble("assistant", "Error: could not reach the server.");
      } finally {
        sendBtn.disabled = false;
        msgInput.focus();
      }
    }

    async function resetChat() {
      await fetch("/reset", { method: "POST" });
    }

    // Submit on Enter (Shift+Enter for newline — textarea would need this, input doesn't)
    msgInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
  </script>
</body>
</html>
